runners:
  local:
    load: galaxy.jobs.runners.local:LocalJobRunner
    workers: 2

execution:
  default: docker_dispatch
  environments:
    local:
      runner: local

    docker_local:
      runner: local
      local_slots: 4
      env:
        - name: CONTAINERS_STORAGE_CONF
          value: "/home/nils-hagner/Documents/repos/galaxy/config/containers-storage.escriptorium.conf"
      docker_enabled: true
      docker_cmd: podman
      docker_sudo: false
      docker_set_user:
      docker_auto_rm: true
      docker_run_extra_arguments: --security-opt label=disable --memory 12g --pids-limit 256
      require_container: true
      container_monitor: true
      container_monitor_result: file

    docker_dispatch:
      runner: dynamic
      type: docker_dispatch
      docker_destination_id: docker_local
      default_destination_id: local
