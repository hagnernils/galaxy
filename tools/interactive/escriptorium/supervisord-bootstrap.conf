[unix_http_server]
file=%(ENV_GALAXY_RUNTIME_DIR)s/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
logfile=%(ENV_GALAXY_WORKSPACE)s/logs/supervisord-bootstrap.log
pidfile=%(ENV_GALAXY_RUNTIME_DIR)s/supervisord-bootstrap.pid
childlogdir=%(ENV_GALAXY_WORKSPACE)s/logs

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix://%(ENV_GALAXY_RUNTIME_DIR)s/supervisor.sock

[program:postgres]
command=/usr/lib/postgresql/15/bin/postgres -D %(ENV_GALAXY_RUNTIME_DIR)s/postgres -k %(ENV_GALAXY_RUNTIME_DIR)s/socket -h 127.0.0.1
user=postgres
priority=10
autorestart=true
stopsignal=INT
stopwaitsecs=45
stdout_logfile=%(ENV_GALAXY_WORKSPACE)s/logs/postgres-bootstrap.log
stderr_logfile=%(ENV_GALAXY_WORKSPACE)s/logs/postgres-bootstrap-error.log

[program:redis]
command=redis-server --bind 127.0.0.1 --protected-mode yes --dir %(ENV_GALAXY_RUNTIME_DIR)s/tmp --dbfilename redis.rdb
priority=10
autorestart=true
stopsignal=TERM
stopwaitsecs=20
stdout_logfile=%(ENV_GALAXY_WORKSPACE)s/logs/redis-bootstrap.log
stderr_logfile=%(ENV_GALAXY_WORKSPACE)s/logs/redis-bootstrap-error.log
