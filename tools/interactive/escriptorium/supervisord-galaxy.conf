[unix_http_server]
file=%(ENV_GALAXY_RUNTIME_DIR)s/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
logfile=%(ENV_GALAXY_WORKSPACE)s/logs/supervisord.log
pidfile=%(ENV_GALAXY_RUNTIME_DIR)s/supervisord.pid
childlogdir=%(ENV_GALAXY_WORKSPACE)s/logs
environment=OPENBLAS_NUM_THREADS="1",OMP_NUM_THREADS="1",MKL_NUM_THREADS="1",NUMEXPR_NUM_THREADS="1"

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix://%(ENV_GALAXY_RUNTIME_DIR)s/supervisor.sock

[program:postgres]
command=/usr/lib/postgresql/15/bin/postgres -D %(ENV_GALAXY_RUNTIME_DIR)s/postgres -k %(ENV_GALAXY_RUNTIME_DIR)s/socket -h 127.0.0.1
user=postgres
priority=10
autorestart=true
stopsignal=INT
stopwaitsecs=45
stdout_logfile=%(ENV_GALAXY_WORKSPACE)s/logs/postgres.log
stderr_logfile=%(ENV_GALAXY_WORKSPACE)s/logs/postgres-error.log

[program:redis]
command=redis-server --bind 127.0.0.1 --protected-mode yes --dir %(ENV_GALAXY_RUNTIME_DIR)s/tmp --dbfilename redis.rdb
priority=10
autorestart=true
stopsignal=TERM
stopwaitsecs=20
stdout_logfile=%(ENV_GALAXY_WORKSPACE)s/logs/redis.log
stderr_logfile=%(ENV_GALAXY_WORKSPACE)s/logs/redis-error.log

[program:uwsgi]
command=uwsgi --module=escriptorium.wsgi:application --master --processes=2 --http=127.0.0.1:8000 --vacuum --die-on-term --static-map /static=%(ENV_GALAXY_RUNTIME_DIR)s/static --static-map /media=%(ENV_GALAXY_RUNTIME_DIR)s/media
directory=/home/escriptorium/escriptorium/app
user=escriptorium
autostart=true
autorestart=true
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=%(ENV_GALAXY_WORKSPACE)s/logs/uwsgi.log
stderr_logfile=%(ENV_GALAXY_WORKSPACE)s/logs/uwsgi-error.log

[program:celery-cpu]
command=celery -A escriptorium worker -l INFO -E -Ofair --prefetch-multiplier 1 --pool=solo --concurrency=1 --max-tasks-per-child=10 -Q default,live,low-priority,gpu
directory=/home/escriptorium/escriptorium/app
user=escriptorium
autostart=true
autorestart=true
stopsignal=TERM
stopwaitsecs=45
stdout_logfile=%(ENV_GALAXY_WORKSPACE)s/logs/celery.log
stderr_logfile=%(ENV_GALAXY_WORKSPACE)s/logs/celery-error.log

[program:channelserver]
command=daphne --bind 127.0.0.1 --port 5000 -v 1 escriptorium.asgi:application
directory=/home/escriptorium/escriptorium/app
user=escriptorium
autostart=true
autorestart=true
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=%(ENV_GALAXY_WORKSPACE)s/logs/daphne.log
stderr_logfile=%(ENV_GALAXY_WORKSPACE)s/logs/daphne-error.log

[program:nginx]
command=/usr/sbin/nginx -p %(ENV_GALAXY_RUNTIME_DIR)s/ -c %(ENV_GALAXY_TOOL_DIR)s/nginx-galaxy.conf -g "pid %(ENV_GALAXY_RUNTIME_DIR)s/nginx.pid; error_log %(ENV_GALAXY_WORKSPACE)s/logs/nginx-error.log;"
autostart=true
autorestart=true
stopsignal=QUIT
stopwaitsecs=30
stdout_logfile=%(ENV_GALAXY_WORKSPACE)s/logs/nginx.log
stderr_logfile=%(ENV_GALAXY_WORKSPACE)s/logs/nginx-supervisor-error.log
